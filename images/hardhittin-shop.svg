<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-label="Hard Hittin Card Shop counter and card wall">
  <title>Hard Hittin Card Shop</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e6d6"/>
      <stop offset="1" stop-color="#e6d7bc"/>
    </linearGradient>
    <linearGradient id="brickwash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b54a2e"/>
      <stop offset="1" stop-color="#8a2f1c"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4a574"/>
      <stop offset="1" stop-color="#8f7448"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#f6efe4"/>
      <circle cx="1" cy="1" r="0.35" fill="#2a1c14" opacity="0.06"/>
      <circle cx="3" cy="3" r="0.3" fill="#2a1c14" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background paper -->
  <rect width="560" height="420" fill="url(#grain)"/>

  <!-- back wall -->
  <rect x="0" y="0" width="560" height="270" fill="url(#wall)"/>

  <!-- brick strip banner -->
  <rect x="0" y="18" width="560" height="58" fill="url(#brickwash)"/>
  <g font-family="Georgia, serif" fill="#f6efe4" text-anchor="middle">
    <text x="280" y="52" font-size="26" letter-spacing="1">HARD HITTIN</text>
    <text x="280" y="68" font-size="12" letter-spacing="6">CARD SHOP</text>
  </g>

  <!-- card wall — grid of graded slabs -->
  <g>
    <g fill="#f6efe4" stroke="#2a1c14" stroke-width="1.2">
      <rect x="30"  y="100" width="70" height="92" rx="3"/>
      <rect x="110" y="100" width="70" height="92" rx="3"/>
      <rect x="190" y="100" width="70" height="92" rx="3"/>
      <rect x="270" y="100" width="70" height="92" rx="3"/>
      <rect x="350" y="100" width="70" height="92" rx="3"/>
      <rect x="430" y="100" width="70" height="92" rx="3"/>
      <rect x="30"  y="200" width="70" height="52" rx="3"/>
      <rect x="110" y="200" width="70" height="52" rx="3"/>
      <rect x="190" y="200" width="70" height="52" rx="3"/>
      <rect x="270" y="200" width="70" height="52" rx="3"/>
      <rect x="350" y="200" width="70" height="52" rx="3"/>
      <rect x="430" y="200" width="70" height="52" rx="3"/>
    </g>
    <!-- little PSA-style labels -->
    <g fill="#b54a2e">
      <rect x="30"  y="100" width="70" height="12"/>
      <rect x="110" y="100" width="70" height="12"/>
      <rect x="190" y="100" width="70" height="12"/>
      <rect x="270" y="100" width="70" height="12"/>
      <rect x="350" y="100" width="70" height="12"/>
      <rect x="430" y="100" width="70" height="12"/>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#f6efe4" text-anchor="middle" letter-spacing="0.5">
      <text x="65"  y="109">GEM MT 10</text>
      <text x="145" y="109">MINT 9</text>
      <text x="225" y="109">GEM MT 10</text>
      <text x="305" y="109">MINT 9</text>
      <text x="385" y="109">GEM MT 10</text>
      <text x="465" y="109">NM-MT 8</text>
    </g>
    <!-- card portraits (silhouettes) -->
    <g fill="#c4a574" opacity="0.85">
      <circle cx="65"  cy="140" r="14"/>
      <circle cx="145" cy="140" r="14"/>
      <circle cx="225" cy="140" r="14"/>
      <circle cx="305" cy="140" r="14"/>
      <circle cx="385" cy="140" r="14"/>
      <circle cx="465" cy="140" r="14"/>
      <rect x="45"  y="158" width="40" height="26" rx="3"/>
      <rect x="125" y="158" width="40" height="26" rx="3"/>
      <rect x="205" y="158" width="40" height="26" rx="3"/>
      <rect x="285" y="158" width="40" height="26" rx="3"/>
      <rect x="365" y="158" width="40" height="26" rx="3"/>
      <rect x="445" y="158" width="40" height="26" rx="3"/>
    </g>
    <g fill="#2a1c14" opacity="0.35" font-family="Helvetica, Arial, sans-serif" font-size="6" text-anchor="middle">
      <text x="65"  y="230">$40</text>
      <text x="145" y="230">$85</text>
      <text x="225" y="230">$120</text>
      <text x="305" y="230">$60</text>
      <text x="385" y="230">$200</text>
      <text x="465" y="230">$30</text>
    </g>
  </g>

  <!-- counter -->
  <rect x="0" y="270" width="560" height="150" fill="url(#counter)"/>
  <rect x="0" y="270" width="560" height="4" fill="#2a1c14" opacity="0.35"/>

  <!-- boxes on counter -->
  <g stroke="#2a1c14" stroke-width="1.2">
    <rect x="40"  y="288" width="120" height="60" fill="#b54a2e"/>
    <rect x="180" y="298" width="90"  height="50" fill="#f6efe4"/>
    <rect x="290" y="292" width="110" height="56" fill="#2a1c14"/>
    <rect x="420" y="300" width="100" height="48" fill="#c4a574"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#f6efe4" text-anchor="middle" letter-spacing="1">
    <text x="100" y="322">HOBBY BOX</text>
    <text x="345" y="323">BLASTER</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#2a1c14" text-anchor="middle" letter-spacing="1">
    <text x="225" y="326">SLABS</text>
    <text x="470" y="328">SUPPLIES</text>
  </g>

  <!-- price tag hanging from counter -->
  <g transform="translate(490 260) rotate(-12)">
    <rect x="0" y="0" width="56" height="30" fill="#f6efe4" stroke="#2a1c14"/>
    <circle cx="6" cy="6" r="2" fill="#2a1c14"/>
    <text x="30" y="14" font-family="Georgia, serif" font-size="9" fill="#b54a2e" text-anchor="middle">OPEN</text>
    <text x="30" y="24" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#2a1c14" text-anchor="middle" letter-spacing="1">WALK-INS</text>
  </g>

  <!-- floor line -->
  <rect x="0" y="416" width="560" height="4" fill="#2a1c14" opacity="0.4"/>
</svg>
